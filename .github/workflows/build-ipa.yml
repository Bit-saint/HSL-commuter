# Builds an unsigned .ipa on a macOS runner. Install it on your iPhone/iPad with Sideloadly
# (it signs the app with your Apple ID). Download it from the run's "Artifacts" section.
name: Build IPA

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HSLCommuter.xcodeproj \
            -scheme HSLCommuter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -200 || true

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HSLCommuter.ipa Payload
          ls -lh HSLCommuter.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HSLCommuter-ipa
          path: HSLCommuter.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

  package-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          set -o pipefail
          cd Packages/CommuterKit && swift test 2>&1 | tail -120
      - name: Station builder tests
        run: python3 -m unittest discover -s tools/stations

  # Launches the app on an iPad simulator and reports crashes (console output + crash report).
  simulator-smoke:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode + XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project HSLCommuter.xcodeproj -scheme HSLCommuter -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build 2>&1 | tail -5
      - name: Launch on iPad simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'iPad' in x['name']]; print(d[-1])")
          echo "runtime $RUNTIME device $DEVTYPE"
          UDID=$(xcrun simctl create smoke "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE" || true
          (xcrun simctl launch --console-pty "$UDID" "$BUNDLE" > console.log 2>&1 &)
          sleep 25
          echo "=== console (last 80 lines) ==="; tail -80 console.log || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then
            echo "APP_ALIVE=yes"
          else
            echo "APP_ALIVE=no"
          fi
          echo "=== crash reports ==="
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/HSLCommuter* 2>/dev/null | head -2); do
            echo "--- $f"; head -c 12000 "$f"; echo
          done
          xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"
