# Builds an unsigned .ipa on a macOS runner. Install it on your iPhone/iPad with Sideloadly
# (it signs the app with your Apple ID). Download it from the run's "Artifacts" section.
name: Build IPA

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HSLCommuter.xcodeproj \
            -scheme HSLCommuter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -200 || true

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HSLCommuter.ipa Payload
          ls -lh HSLCommuter.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HSLCommuter-ipa
          path: HSLCommuter.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

  package-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          set -o pipefail
          export VEHICLE_PREVIEW_DIR="$GITHUB_WORKSPACE/vehicle-previews"
          cd Packages/CommuterKit && swift test 2>&1 | tail -120
      - name: Station builder tests
        run: python3 -m unittest discover -s tools/stations
      - name: Translations complete and catalogs up to date
        run: |
          python3 tools/l10n/build_catalogs.py
          git diff --exit-code -- App/Localizable.xcstrings Widgets/Localizable.xcstrings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-previews
          path: vehicle-previews
          retention-days: 30

  # Launches the app on an iPad simulator and reports crashes (console output + crash report).
  simulator-smoke:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode + XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project HSLCommuter.xcodeproj -scheme HSLCommuter -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build 2>&1 | tail -5
      - name: Launch on iPad simulator
        run: |
          # Newest iOS runtime and an iPad model it supports.
          read RUNTIME DEVTYPE < <(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']]
          r = rs[-1]
          ipads = [d['identifier'] for d in r.get('supportedDeviceTypes', []) if 'iPad' in d['name']]
          print(r['identifier'], ipads[-1])")
          echo "runtime $RUNTIME device $DEVTYPE"
          UDID=$(xcrun simctl create smoke "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE" || true
          (xcrun simctl launch --console-pty "$UDID" "$BUNDLE" > console.log 2>&1 &)
          sleep 25
          echo "=== console (last 80 lines) ==="; tail -80 console.log || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then
            echo "APP_ALIVE=yes"
          else
            echo "APP_ALIVE=no"
          fi
          echo "=== crash reports ==="
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/HSLCommuter* 2>/dev/null | head -2); do
            echo "--- $f"; head -c 12000 "$f"; echo
          done
          xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"

  # Plays the bundled demo trip on an iPad and an iPhone simulator and screenshots the real app.
  demo-screenshots:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Xcode + XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project HSLCommuter.xcodeproj -scheme HSLCommuter -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build 2>&1 | tail -5
      - name: Play the demo and take screenshots
        run: |
          # Every simulator command gets a time limit, so a stuck one can't hang the job.
          t() { local secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@" < /dev/null; }
          read RUNTIME IPAD IPHONE < <(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']]
          r = rs[-1]
          t = r.get('supportedDeviceTypes', [])
          ipads = [d['identifier'] for d in t if 'iPad Pro' in d['name']] or [d['identifier'] for d in t if 'iPad' in d['name']]
          phones = [d['identifier'] for d in t if d['name'].endswith('Pro')] or [d['identifier'] for d in t if 'iPhone' in d['name']]
          print(r['identifier'], ipads[-1], phones[-1])")
          echo "runtime $RUNTIME ipad $IPAD iphone $IPHONE"
          APP=$(find simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p shots
          IPAD_ID=$(t 120 xcrun simctl create demo-ipad "$IPAD" "$RUNTIME")
          IPHONE_ID=$(t 120 xcrun simctl create demo-iphone "$IPHONE" "$RUNTIME")
          for ID in $IPAD_ID $IPHONE_ID; do t 300 xcrun simctl boot "$ID" || true; done
          for ID in $IPAD_ID $IPHONE_ID; do
            echo "waiting for $ID"; t 600 xcrun simctl bootstatus "$ID" -b > /dev/null || echo "bootstatus timed out"
            t 300 xcrun simctl install "$ID" "$APP"
            t 60 xcrun simctl status_override "$ID" --time "07:47" --batteryState charged --batteryLevel 100 || true
          done
          echo "launching"
          t 60 xcrun simctl launch "$IPAD_ID" "$BUNDLE" -demo -demoSpeed 12 || echo "ipad launch failed"
          # The iPhone runs in Finnish to check the translations.
          t 60 xcrun simctl launch "$IPHONE_ID" "$BUNDLE" -demo -demoSpeed 12 -AppleLanguages "(fi)" -AppleLocale fi_FI || echo "iphone launch failed"
          START=$(date +%s)
          # Real seconds after launch at 12x: leave time, walking, at the stop, riding, walking to work.
          for AT in 8 33 56 95 146; do
            while [ $(( $(date +%s) - START )) -lt $AT ]; do sleep 1; done
            echo "shot at ${AT}s"
            t 30 xcrun simctl io "$IPAD_ID" screenshot "shots/ipad-$AT.png" > /dev/null 2>&1 || echo "ipad shot failed"
            t 30 xcrun simctl io "$IPHONE_ID" screenshot "shots/iphone-$AT.png" > /dev/null 2>&1 || echo "iphone shot failed"
          done
          ls -la shots
          # Small JPEGs inline in the log, so the run can be reviewed without downloading.
          for f in shots/*.png; do
            sips -Z 520 -s format jpeg -s formatOptions 40 "$f" --out "${f%.png}.jpg" > /dev/null
            echo "=== BEGIN $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | fold -w 4000
            echo "=== END ==="
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshots
          path: shots/*.png
          retention-days: 30
