# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: HSLCommuter
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
packages:
  CommuterKit:
    path: Packages/CommuterKit
targets:
  HSLCommuter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CommuterKit
        product: ETAEngine
      - package: CommuterKit
        product: HSLKit
      - package: CommuterKit
        product: HSLDesign
      - target: CommuterWidgets
    entitlements:
      path: Config/HSLCommuter.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Commuter
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [location, fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [fi.hslcommuter.refresh]
        NSLocationWhenInUseUsageDescription: Your location is used to tell you when to leave and how fast to walk to your stop.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lets tracking start by itself when you leave home or work, and keep running with the screen locked.
        NSMotionUsageDescription: Motion tells the app when you get on and off, so you don't have to tap anything.
        NSCalendarsFullAccessUsageDescription: Your first meeting can set the time you need to be at work, and days marked off skip reminders. Nothing is changed or shared.
        AppGroupID: $(APP_GROUP_ID)
        DigitransitAPIKey: $(DIGITRANSIT_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).commuter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CommuterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: CommuterKit
        product: ETAEngine
      - package: CommuterKit
        product: HSLDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Config/CommuterWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Commuter Widgets
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).commuter.widgets

schemes:
  HSLCommuter:
    build:
      targets:
        HSLCommuter: all
        CommuterWidgets: all
    run:
      config: Debug
